<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wetter App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Wetter App</h1>
            <div class="controls">
                <button id="themeToggle" class="btn-theme">🌙</button>
                <button id="unitToggle" class="btn-unit">°F</button>
            </div>
        </header>

        <main>
            <div class="search-section">
                <div class="search-container">
                    <input type="text" id="cityInput" placeholder="Stadt eingeben..." autocomplete="off">
                    <button id="searchBtn">🔍</button>
                    <button id="locationBtn" title="Aktueller Standort">📍</button>
                </div>
            </div>

            <div id="loadingSpinner" class="loading hidden">
                <div class="spinner"></div>
                <p>Wetterdaten werden geladen...</p>
            </div>

            <div id="errorMessage" class="error hidden">
                <p>Fehler beim Laden der Wetterdaten. Bitte versuchen Sie es erneut.</p>
            </div>

            <div id="weatherContainer" class="weather-container hidden">
                <div class="current-weather">
                    <div class="location">
                        <h2 id="cityName">-</h2>
                        <p id="currentDate">-</p>
                    </div>
                    
                    <div class="weather-main">
                        <div class="temperature">
                            <span id="currentTemp">-</span>
                            <span class="unit">°C</span>
                        </div>
                        <div class="weather-icon">
                            <img id="weatherIcon" src="" alt="Wetter Icon">
                            <p id="weatherDescription">-</p>
                        </div>
                    </div>

                    <div class="weather-details">
                        <div class="detail">
                            <span class="label">Gefühlt wie:</span>
                            <span id="feelsLike">-°C</span>
                        </div>
                        <div class="detail">
                            <span class="label">Luftfeuchtigkeit:</span>
                            <span id="humidity">-%</span>
                        </div>
                        <div class="detail">
                            <span class="label">Wind:</span>
                            <span id="windSpeed">- km/h</span>
                        </div>
                        <div class="detail">
                            <span class="label">Luftdruck:</span>
                            <span id="pressure">- hPa</span>
                        </div>
                        <div class="detail">
                            <span class="label">Sichtweite:</span>
                            <span id="visibility">- km</span>
                        </div>
                        <div class="detail">
                            <span class="label">UV-Index:</span>
                            <span id="uvIndex">-</span>
                        </div>
                    </div>
                </div>

                <div class="forecast-section">
                    <h3>5-Tage Vorhersage</h3>
                    <div id="forecastContainer" class="forecast-container">
                        <!-- Forecast cards will be inserted here -->
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>Wetterdaten bereitgestellt von <a href="https://openweathermap.org/" target="_blank">OpenWeatherMap</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
